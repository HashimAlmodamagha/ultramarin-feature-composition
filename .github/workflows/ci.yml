name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv pip install --system -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests scripts && ruff format --check src tests scripts
      - name: Types (mypy)
        run: mypy src
      - name: Tests (pytest)
        run: pytest
      - name: Synthetic end-to-end demo
        run: feature-composition demo --n-days 200 --n-names 80
